# Spec 03 §5 — build, lint and test matrix. Every job configures, builds, runs the lints and the
# full ctest suite, then the offscreen `--selftest` and uploads its screenshots.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The dependency cache is a directory in the source tree (see CMakeLists.txt FETCHCONTENT_BASE_DIR).
  DEPS_DIR: .deps

jobs:
  build:
    name: ${{ matrix.name }} · ${{ matrix.preset }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64 (AppleClang)
            runner: macos-26   # Xcode 26 / AppleClang 21: std::jthread, std::expected
            preset: release
          - name: Ubuntu (Clang 20)
            runner: ubuntu-24.04
            preset: debug
            cc: clang-20
            cxx: clang++-20
            llvm: "20"
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      # A software GL implementation so the offscreen renderer and `--selftest` can run headless.
      - name: Install Mesa and GL headers (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libglu1-mesa-dev mesa-utils \
                                  libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
                                  wayland-protocols libwayland-dev libxkbcommon-dev pkg-config \
                                  xvfb libosmesa6
      # Clang 18 cannot enable libstdc++'s std::expected (its __cpp_concepts predates P2493);
      # the Clang job uses the LLVM apt repository for a recent release.
      - name: Install Clang (Linux)
        if: runner.os == 'Linux' && matrix.llvm != ''
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ matrix.llvm }}
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.DEPS_DIR }}
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        # Warnings are errors on the platform the code is verified on; the other compilers build
        # with warnings visible until their logs are clean, then they get -Werror too.
        run: cmake --preset ${{ matrix.preset }} -DQXL_WERROR=${{ runner.os == 'macOS' && 'ON' || 'OFF' }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -j

      - name: clang-format check
        if: runner.os == 'macOS'
        run: |
          # Pinned: formatting drifts between major releases (23 reflowed 75 files that 22 accepts).
          python3 -m venv .clang-format-venv
          .clang-format-venv/bin/pip install --quiet clang-format==22.1.5
          files=$(git ls-files 'src/*.cpp' 'src/*.hpp' 'tests/*.cpp' 'tests/*.hpp')
          .clang-format-venv/bin/clang-format --version
          .clang-format-venv/bin/clang-format --dry-run --Werror $files

      - name: Include lint (layering rules G1/P1 of spec 02 §1)
        if: runner.os == 'macOS'
        run: python3 tools/check_includes.py

      - name: Asset lint
        if: runner.os == 'macOS'
        run: |
          python3 tools/check_xrefs.py
          python3 tools/gen_assets.py
          git diff --exit-code Assets  # generated assets must be committed in sync

      - name: Test
        # Linux runners have no display: xvfb provides one and Mesa's llvmpipe the GL 4.x context.
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a -s "-screen 0 1600x1000x24" ' || '' }}ctest --preset ${{ matrix.preset }} --output-on-failure -j 4
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          # Timing oracles are workstation figures; shared runners get slack (software GL on Linux far more).
          QXL_PERF_SLACK: ${{ runner.os == 'Linux' && '60' || '4' }}

      # A crash on the software renderer is only actionable with a stack: rerun the failing GL
      # suites under gdb and print the backtrace (Linux only, only after a test failure).
      - name: Backtraces of crashed suites (Linux)
        if: failure() && runner.os == 'Linux'
        run: |
          sudo apt-get install -y gdb > /dev/null
          # Each entry is "<binary> <catch2 filter>"; ctest runs every case in its own process,
          # so a case is reproduced the same way, alone.
          while read -r t filter; do
            b=build/${{ matrix.preset }}/bin/$t
            [ -x "$b" ] || continue
            echo "=== $t $filter"
            xvfb-run -a -s "-screen 0 1600x1000x24" gdb -batch -ex run -ex bt -ex quit --args "$b" "$filter" 2>&1 | tail -60 || true
          done <<'EOF'
          test_lang every analysis recipe*
          test_viz circuit view*
          test_app the application draws*
          test_app the selftest mode*
          EOF
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          QXL_PERF_SLACK: "60"
        shell: bash

      - name: Self-test screenshots
        run: |
          cmake --build --preset ${{ matrix.preset }} --target quantumxlab
          ${{ runner.os == 'Linux' && 'xvfb-run -a -s "-screen 0 1600x1000x24" ' || '' }}./build/${{ matrix.preset }}/bin/quantumxlab --selftest selftest-out
        shell: bash
        continue-on-error: true

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: selftest-${{ runner.os }}-${{ matrix.preset }}
          path: selftest-out/
          if-no-files-found: ignore
